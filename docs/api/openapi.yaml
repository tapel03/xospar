openapi: 3.0.3
info: { title: Edgeline API, version: 0.1.0, description: "Symbols use the app format, e.g. EUR/USD. WebSocket price stream at /ws." }
paths:
  /health:
    get: { summary: Feed and AI provider status, responses: { '200': { description: OK } } }
  /v1/assets:
    get: { summary: Asset catalogue, responses: { '200': { description: "{ items: [{ sym, name, cat, dec, live, candles }] }" } } }
  /v1/quotes:
    get:
      summary: Latest quotes
      parameters: [ { name: syms, in: query, required: true, schema: { type: string }, description: "Comma separated app symbols, max 60" } ]
      responses: { '200': { description: "{ quotes: [Quote], missing: [sym] }" } }
  /v1/candles:
    get:
      summary: Candles for one symbol
      parameters:
        - { name: sym, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1m, 5m, 15m, 30m, 1H, 2H, 4H, 1D, 1W, 1M], default: 1D } }
      responses:
        '200': { description: "{ sym, range, status: ready|unsupported|unavailable, source, candles: [{ time, open, high, low, close }] }" }
        '400': { description: bad_range }
        '404': { description: unknown_symbol }
  /v1/news:
    get:
      summary: Scored, deduplicated market news in the app's card shape
      parameters: [ { name: limit, in: query, schema: { type: integer, maximum: 100 } } ]
      responses: { '200': { description: "{ stale, items: [{ id, cat, headline, source, time, tags, relevance, summary, why, affects, url, publishedAt }] }" }, '502': { description: news_unavailable } }
  /v1/mood:
    get: { summary: Global market mood from the news feed, responses: { '200': { description: "{ mood, description, metrics[4], updatedAt, stale }" }, '204': { description: Not enough news } } }
  /v1/ai/chat:
    post:
      summary: Chat with the market, asset or mentor assistant
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [messages], properties: { messages: { type: array, maxItems: 20, items: { type: object, properties: { role: { type: string, enum: [user, assistant] }, text: { type: string, maxLength: 4000 } } } }, persona: { type: string, enum: [market, asset, mentor] }, context: { type: object, properties: { symbol: { type: string } } } } } } } }
      responses: { '200': { description: "{ reply, provider, remaining }" }, '400': { description: invalid request }, '429': { description: quota_exceeded }, '503': { description: ai_unconfigured } }
  /v1/ai/status:
    get: { summary: Which AI providers are configured, responses: { '200': { description: OK } } }
