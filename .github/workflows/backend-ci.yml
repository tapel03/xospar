name: backend-ci
on:
  push: { paths: ["backend/**", "packages/**", "package.json", ".github/workflows/backend-ci.yml"] }
  pull_request: { paths: ["backend/**", "packages/**", "package.json"] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run backend:test
